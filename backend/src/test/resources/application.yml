spring:
  datasource:
    url: jdbc:h2:mem:space_target_visible;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

# 所有 Spring 测试均使用系统临时目录，禁止新文件清理任务触碰默认部署 storage。
ballistic:
  files:
    root: ${java.io.tmpdir}/space-ballistic-tests-${random.uuid}

space:
  visibility:
    downlink:
      default-pre-guard-sec: 300
      default-post-guard-sec: 0
      default-allowed-gap-sec: 0
    calculation:
      worker-threads: 2
      max-pair-tasks: 10000
